<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Hub - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-card: rgba(20, 20, 20, 0.9);
            --bg-card-hover: rgba(30, 30, 30, 0.95);
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-hover: #818cf8;
            --border-color: rgba(99, 102, 241, 0.2);
            --border-hover: rgba(99, 102, 241, 0.4);
            --shadow: rgba(0, 0, 0, 0.5);
            --shadow-hover: rgba(99, 102, 241, 0.15);
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 3em;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow);
        }

        .login-container h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .login-container input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1em;
        }

        .login-container input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow-hover);
        }

        .error-message {
            color: #ef4444;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .timeframe-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .timeframe-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timeframe-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .timeframe-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-hover);
            color: #fff;
        }

        .chart-container {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            margin-bottom: 30px;
        }

        .chart-container h3 {
            margin-bottom: 20px;
        }

        .top-games {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
        }

        .top-games h3 {
            margin-bottom: 20px;
        }

        .game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .game-item:last-child {
            margin-bottom: 0;
        }

        .game-name {
            font-weight: 600;
            text-transform: capitalize;
        }

        .game-count {
            color: var(--accent-primary);
            font-weight: bold;
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <h2>🔐 Admin Login 3</h2>
        <input type="password" id="admin-password" placeholder="Enter admin password" autocomplete="off">
        <button onclick="login()">Login</button>
        <div class="error-message" id="login-error">Invalid password</div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <button class="logout-btn" onclick="logout()">Logout</button>
        
        <div class="container">
            <div class="header">
                <h1>📊 Analytics Dashboard</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Visitors</h3>
                    <div class="value" id="total-visitors">0</div>
                </div>
                <div class="stat-card">
                    <h3>Active Sessions</h3>
                    <div class="value" id="active-sessions">0</div>
                </div>
                <div class="stat-card">
                    <h3>Avg. Session Duration</h3>
                    <div class="value" id="avg-duration">0s</div>
                </div>
                <div class="stat-card">
                    <h3>Total Game Plays</h3>
                    <div class="value" id="total-plays">0</div>
                </div>
            </div>

            <div class="timeframe-selector">
                <button class="timeframe-btn" data-timeframe="1hour" onclick="selectTimeframe('1hour')">1 Hour</button>
                <button class="timeframe-btn" data-timeframe="12hours" onclick="selectTimeframe('12hours')">12 Hours</button>
                <button class="timeframe-btn" data-timeframe="day" onclick="selectTimeframe('day')">Day</button>
                <button class="timeframe-btn" data-timeframe="3days" onclick="selectTimeframe('3days')">3 Days</button>
                <button class="timeframe-btn" data-timeframe="week" onclick="selectTimeframe('week')">Week</button>
                <button class="timeframe-btn" data-timeframe="2weeks" onclick="selectTimeframe('2weeks')">2 Weeks</button>
                <button class="timeframe-btn" data-timeframe="month" onclick="selectTimeframe('month')">Month</button>
                <button class="timeframe-btn" data-timeframe="6months" onclick="selectTimeframe('6months')">6 Months</button>
                <button class="timeframe-btn" data-timeframe="year" onclick="selectTimeframe('year')">Year</button>
                <button class="timeframe-btn active" data-timeframe="total" onclick="selectTimeframe('total')">Total</button>
            </div>

            <div class="chart-container">
                <h3>Visitor Statistics</h3>
                <canvas id="visitor-chart"></canvas>
            </div>

            <div class="top-games">
                <h3>🎮 Top 10 Most Played Games</h3>
                <div id="top-games-list" class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let authToken = localStorage.getItem('admin_token');
        let currentTimeframe = 'total';
        let visitorChart = null;

        // Check if already logged in
        if (authToken) {
            verifySession();
        }

        async function verifySession() {
            try {
                const response = await fetch(`${API_URL}/api/admin/verify`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const data = await response.json();
                if (data.valid) {
                    showDashboard();
                } else {
                    localStorage.removeItem('admin_token');
                    authToken = null;
                }
            } catch (error) {
                console.error('Session verification error:', error);
                localStorage.removeItem('admin_token');
                authToken = null;
            }
        }

        async function login() {
            const password = document.getElementById('admin-password').value;
            const errorDiv = document.getElementById('login-error');

            if (!password) {
                errorDiv.textContent = 'Please enter a password';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    authToken = data.token;
                    localStorage.setItem('admin_token', authToken);
                    errorDiv.style.display = 'none';
                    showDashboard();
                } else {
                    errorDiv.style.display = 'block';
                    document.getElementById('admin-password').value = '';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection error. Is the server running?';
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            if (authToken) {
                fetch(`${API_URL}/api/admin/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                }).catch(() => {});
            }
            localStorage.removeItem('admin_token');
            authToken = null;
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            loadDashboard();
        }

        function selectTimeframe(timeframe) {
            currentTimeframe = timeframe;
            document.querySelectorAll('.timeframe-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-timeframe="${timeframe}"]`).classList.add('active');
            loadDashboard();
        }

        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
            return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
        }

        async function loadDashboard() {
            try {
                // Show loading state
                document.getElementById('top-games-list').innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
                
                // Load all data in parallel for better performance
                const [statsResponse, activeResponse, chartResponse, gamesResponse] = await Promise.all([
                    fetch(`${API_URL}/api/stats/${currentTimeframe}`),
                    fetch(`${API_URL}/api/active-sessions`),
                    fetch(`${API_URL}/api/chart/${currentTimeframe}`),
                    fetch(`${API_URL}/api/top-games?limit=10`)
                ]);

                const stats = await statsResponse.json();
                const activeData = await activeResponse.json();
                const chartData = await chartResponse.json();
                const topGames = await gamesResponse.json();

                // Update stats
                document.getElementById('total-visitors').textContent = stats.uniqueVisitors || 0;
                document.getElementById('avg-duration').textContent = formatDuration(stats.avgDuration || 0);
                document.getElementById('total-plays').textContent = stats.totalGamePlays || 0;
                document.getElementById('active-sessions').textContent = activeData.activeSessions || 0;

                // Update chart
                updateChart(chartData);

                // Update top games
                const gamesList = document.getElementById('top-games-list');
                if (topGames.length === 0) {
                    gamesList.innerHTML = '<p style="color: var(--text-secondary);">No games played yet</p>';
                } else {
                    gamesList.innerHTML = topGames.map((game, index) => `
                        <div class="game-item">
                            <span class="game-name">${index + 1}. ${game.game_name.replace(/-/g, ' ')}</span>
                            <span class="game-count">${game.play_count} plays</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Dashboard load error:', error);
                document.getElementById('top-games-list').innerHTML = '<p style="color: #ef4444;">Error loading data. Please refresh.</p>';
            }
        }

        function updateChart(data) {
            const ctx = document.getElementById('visitor-chart').getContext('2d');

            if (visitorChart) {
                visitorChart.destroy();
            }

            // Format labels based on timeframe
            const labels = data.map(item => {
                const date = new Date(item.time);
                // Format based on timeframe
                if (currentTimeframe === '1hour' || currentTimeframe === '12hours') {
                    return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                } else if (currentTimeframe === 'day' || currentTimeframe === '3days') {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit' });
                } else {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                }
            });

            visitorChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Unique Visitors',
                            data: data.map(item => item.uniqueVisitors),
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 4
                        },
                        {
                            label: 'Total Visits',
                            data: data.map(item => item.totalVisits),
                            borderColor: '#8b5cf6',
                            backgroundColor: 'rgba(139, 92, 246, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: {
                        duration: 750
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#e0e0e0'
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#a0a0a0',
                                maxRotation: 45,
                                minRotation: 0
                            },
                            grid: {
                                color: 'rgba(99, 102, 241, 0.1)'
                            }
                        },
                        y: {
                            ticks: {
                                color: '#a0a0a0',
                                precision: 0
                            },
                            grid: {
                                color: 'rgba(99, 102, 241, 0.1)'
                            },
                            beginAtZero: true
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        // Auto-refresh every 60 seconds (reduced frequency for better performance)
        setInterval(() => {
            if (authToken && document.getElementById('dashboard').classList.contains('active')) {
                loadDashboard();
            }
        }, 60000);

        // Allow Enter key to login
        document.getElementById('admin-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
