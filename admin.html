<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Hub - Admin Panel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap");
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background-color: #0a0a0a;
            --background-input: rgba(42, 42, 42, 0.6);
            --background-column: rgba(37, 37, 37, 0.7);
            --background-settings: rgba(42, 42, 42, 0.8);
            --background-buttons: rgba(42, 42, 42, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-dark: #666;
            --save-button: #4a9eff;
            --accent-primary: #4a9eff;
            --accent-hover: #6ab3ff;
            --border-color: rgba(74, 158, 255, 0.2);
            --border-hover: rgba(74, 158, 255, 0.4);
            --backdrop-filter: blur(10px) brightness(80%);
        }

        ::-webkit-scrollbar {
            width: 6px;
            background-color: var(--background-color);
        }

        ::-webkit-scrollbar-track {
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            background-color: var(--background-color);
        }

        ::-webkit-scrollbar-thumb {
            border-radius: 10px;
            -webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
            background-color: var(--text-primary);
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--text-dark);
        }

        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(74, 158, 255, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 40% 20%, rgba(74, 158, 255, 0.08) 0%, transparent 60%);
            opacity: 1;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-size: 3em;
            font-family: "Inter", sans-serif;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.5), 2px 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: var(--background-column);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), 0 0 20px rgba(74, 158, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .login-container h2 {
            margin-bottom: 20px;
            text-align: center;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            color: var(--text-primary);
        }

        .login-container input {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 20px;
            background: var(--background-input);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            border: 2px solid transparent;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1em;
            font-family: "Inter", sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .login-container input::placeholder {
            color: var(--text-secondary);
            opacity: 1;
        }

        .login-container input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
            background: rgba(42, 42, 42, 0.8);
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            background: var(--save-button);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1em;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 158, 255, 0.3);
        }

        .login-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(74, 158, 255, 0.5);
            background: var(--accent-hover);
        }

        .error-message {
            color: #ef4444;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .dashboard {
            display: none;
            position: relative;
            z-index: 10;
        }

        .dashboard.active {
            display: block;
        }

        h3 {
            font-family: "Inter", sans-serif;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--background-column);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 6px 25px rgba(74, 158, 255, 0.2);
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: "Inter", sans-serif;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: 800;
            color: var(--accent-primary);
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
            font-family: "Inter", sans-serif;
        }

        .timeframe-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .timeframe-btn {
            padding: 10px 20px;
            background: var(--background-column);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: "Inter", sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .timeframe-btn:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }

        .timeframe-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
        }

        .chart-container {
            background: var(--background-column);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .chart-container h3 {
            margin-bottom: 20px;
        }

        .top-games {
            background: var(--background-column);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .top-games h3 {
            margin-bottom: 20px;
        }

        .game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: var(--background-input);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .game-item:hover {
            border-color: var(--border-color);
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.2);
        }

        .game-item:last-child {
            margin-bottom: 0;
        }

        .game-name {
            font-weight: 600;
            font-family: "Inter", sans-serif;
            text-transform: capitalize;
            color: var(--text-primary);
        }

        .game-count {
            color: var(--accent-primary);
            font-weight: 800;
            font-family: "Inter", sans-serif;
            text-shadow: 0 0 10px rgba(74, 158, 255, 0.5);
        }

        .logout-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #ff4444;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: "Inter", sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
            z-index: 1000;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 68, 68, 0.5);
            background: #ff6666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .bugs-section {
            margin-top: 40px;
        }

        .bug-item {
            background: var(--background-input);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .bug-item:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.2);
        }

        .bug-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .bug-id {
            color: var(--accent-primary);
            font-weight: 600;
            font-family: "Inter", sans-serif;
            text-shadow: 0 0 10px rgba(74, 158, 255, 0.5);
        }

        .bug-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .bug-status.pending {
            background: #f59e0b;
            color: #fff;
        }

        .bug-status.in-progress {
            background: #3b82f6;
            color: #fff;
        }

        .bug-status.resolved {
            background: #10b981;
            color: #fff;
        }

        .bug-status.closed {
            background: #6b7280;
            color: #fff;
        }

        .bug-description {
            color: var(--text-primary);
            margin: 10px 0;
            line-height: 1.6;
            font-family: "Inter", sans-serif;
        }

        .bug-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .bug-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .bug-action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s ease;
        }

        .bug-action-btn:hover {
            transform: translateY(-1px);
        }

        .no-bugs {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .google-forms-section {
            margin-top: 40px;
        }

        .form-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-tab {
            padding: 10px 20px;
            background: var(--background-column);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: "Inter", sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-tab:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.3);
        }

        .form-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
        }

        .form-response-item {
            background: var(--background-input);
            -webkit-backdrop-filter: var(--backdrop-filter);
            backdrop-filter: var(--backdrop-filter);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .form-response-item:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.2);
        }

        .form-response-field {
            margin-bottom: 12px;
        }

        .form-response-field:last-child {
            margin-bottom: 0;
        }

        .form-response-label {
            font-weight: 600;
            color: var(--accent-primary);
            font-family: "Inter", sans-serif;
            font-size: 0.9em;
            margin-bottom: 4px;
            display: block;
        }

        .form-response-value {
            color: var(--text-primary);
            font-family: "Inter", sans-serif;
            word-wrap: break-word;
        }

        .form-response-count {
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-family: "Inter", sans-serif;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <h2>🔐 Admin Login</h2>
        <input type="email" id="admin-email" placeholder="Enter email address" autocomplete="email">
        <input type="password" id="admin-password" placeholder="Enter password" autocomplete="current-password">
        <button onclick="login()">Login</button>
        <div class="error-message" id="login-error">Invalid email or password</div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <button class="logout-btn" onclick="logout()">Logout</button>
        
        <div class="container">
            <div class="header">
                <h1>📊 Analytics Dashboard</h1>
                <p id="user-info" style="color: var(--text-secondary); margin-top: 10px; font-family: 'Inter', sans-serif;"></p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Visitors</h3>
                    <div class="value" id="total-visitors">0</div>
                </div>
                <div class="stat-card">
                    <h3>Active Sessions</h3>
                    <div class="value" id="active-sessions">0</div>
                </div>
                <div class="stat-card">
                    <h3>Avg. Session Duration</h3>
                    <div class="value" id="avg-duration">0s</div>
                </div>
                <div class="stat-card">
                    <h3>Total Game Plays</h3>
                    <div class="value" id="total-plays">0</div>
                </div>
            </div>

            <div class="timeframe-selector">
                <button class="timeframe-btn" data-timeframe="1hour" onclick="selectTimeframe('1hour')">1 Hour</button>
                <button class="timeframe-btn" data-timeframe="12hours" onclick="selectTimeframe('12hours')">12 Hours</button>
                <button class="timeframe-btn" data-timeframe="day" onclick="selectTimeframe('day')">Day</button>
                <button class="timeframe-btn" data-timeframe="3days" onclick="selectTimeframe('3days')">3 Days</button>
                <button class="timeframe-btn" data-timeframe="week" onclick="selectTimeframe('week')">Week</button>
                <button class="timeframe-btn" data-timeframe="2weeks" onclick="selectTimeframe('2weeks')">2 Weeks</button>
                <button class="timeframe-btn" data-timeframe="month" onclick="selectTimeframe('month')">Month</button>
                <button class="timeframe-btn" data-timeframe="6months" onclick="selectTimeframe('6months')">6 Months</button>
                <button class="timeframe-btn" data-timeframe="year" onclick="selectTimeframe('year')">Year</button>
                <button class="timeframe-btn active" data-timeframe="total" onclick="selectTimeframe('total')">Total</button>
            </div>

            <div class="chart-container">
                <h3>Visitor Statistics</h3>
                <canvas id="visitor-chart"></canvas>
            </div>

            <div class="top-games">
                <h3>🎮 Top 10 Most Played Games</h3>
                <div id="top-games-list" class="loading">Loading...</div>
            </div>

            <div class="bugs-section">
                <h3>🐛 Bug Reports</h3>
                <div style="margin-bottom: 15px;">
                    <button class="timeframe-btn" onclick="loadBugs('pending')" style="margin-right: 10px;">Pending</button>
                    <button class="timeframe-btn" onclick="loadBugs('in-progress')" style="margin-right: 10px;">In Progress</button>
                    <button class="timeframe-btn" onclick="loadBugs('resolved')" style="margin-right: 10px;">Resolved</button>
                    <button class="timeframe-btn" onclick="loadBugs(null)">All</button>
                </div>
                <div id="bugs-list" class="loading">Loading...</div>
            </div>

            <div class="google-forms-section">
                <h3>📋 Google Forms Responses</h3>
                <div class="form-tabs">
                    <button class="form-tab active" onclick="loadFormResponses('Bug Reports')">Bug Reports</button>
                    <button class="form-tab" onclick="loadFormResponses('Game Requests')">Game Requests</button>
                    <button class="form-tab" onclick="loadAllFormResponses()">All Forms</button>
                </div>
                <div id="google-forms-list" class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let authToken = localStorage.getItem('admin_token');
        let currentUser = null;
        let currentTimeframe = 'total';
        let visitorChart = null;

        // Check if already logged in
        if (authToken) {
            verifySession();
        }

        async function verifySession() {
            try {
                const response = await fetch(`${API_URL}/api/admin/verify`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const data = await response.json();
                if (data.valid && data.user) {
                    currentUser = data.user;
                    showDashboard();
                } else {
                    localStorage.removeItem('admin_token');
                    authToken = null;
                    currentUser = null;
                }
            } catch (error) {
                console.error('Session verification error:', error);
                localStorage.removeItem('admin_token');
                authToken = null;
                currentUser = null;
            }
        }

        async function login() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const errorDiv = document.getElementById('login-error');

            if (!email || !password) {
                errorDiv.textContent = 'Please enter both email and password';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('admin_token', authToken);
                    errorDiv.style.display = 'none';
                    showDashboard();
                } else {
                    errorDiv.textContent = data.error || 'Invalid email or password';
                    errorDiv.style.display = 'block';
                    document.getElementById('admin-password').value = '';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection error. Is the server running?';
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            if (authToken) {
                fetch(`${API_URL}/api/admin/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                }).catch(() => {});
            }
            localStorage.removeItem('admin_token');
            authToken = null;
            currentUser = null;
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-password').value = '';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            
            // Display user info
            if (currentUser) {
                const userInfo = document.getElementById('user-info');
                userInfo.textContent = `Logged in as: ${currentUser.name || currentUser.email} (${currentUser.role || 'admin'})`;
            }
            
            loadDashboard();
            loadBugs(); // Load bugs when dashboard is shown
            loadFormResponses('Bug Reports'); // Load Google Forms responses
        }

        function selectTimeframe(timeframe) {
            currentTimeframe = timeframe;
            document.querySelectorAll('.timeframe-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-timeframe="${timeframe}"]`).classList.add('active');
            loadDashboard();
        }

        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
            return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
        }

        async function loadDashboard() {
            try {
                // Show loading state
                document.getElementById('top-games-list').innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
                
                // Load all data in parallel for better performance
                const [statsResponse, activeResponse, chartResponse, gamesResponse] = await Promise.all([
                    fetch(`${API_URL}/api/stats/${currentTimeframe}`),
                    fetch(`${API_URL}/api/active-sessions`),
                    fetch(`${API_URL}/api/chart/${currentTimeframe}`),
                    fetch(`${API_URL}/api/top-games?limit=10`)
                ]);

                const stats = await statsResponse.json();
                const activeData = await activeResponse.json();
                const chartData = await chartResponse.json();
                const topGames = await gamesResponse.json();

                // Update stats
                document.getElementById('total-visitors').textContent = stats.uniqueVisitors || 0;
                document.getElementById('avg-duration').textContent = formatDuration(stats.avgDuration || 0);
                document.getElementById('total-plays').textContent = stats.totalGamePlays || 0;
                document.getElementById('active-sessions').textContent = activeData.activeSessions || 0;

                // Update chart
                updateChart(chartData);

                // Update top games
                const gamesList = document.getElementById('top-games-list');
                if (topGames.length === 0) {
                    gamesList.innerHTML = '<p style="color: var(--text-secondary);">No games played yet</p>';
                } else {
                    gamesList.innerHTML = topGames.map((game, index) => `
                        <div class="game-item">
                            <span class="game-name">${index + 1}. ${game.game_name.replace(/-/g, ' ')}</span>
                            <span class="game-count">${game.play_count} plays</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Dashboard load error:', error);
                document.getElementById('top-games-list').innerHTML = '<p style="color: #ef4444;">Error loading data. Please refresh.</p>';
            }
        }

        // Load bugs
        async function loadBugs(status = null) {
            const bugsList = document.getElementById('bugs-list');
            if (!bugsList) return;
            
            bugsList.innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
            
            try {
                const url = status ? `${API_URL}/api/bugs?status=${status}` : `${API_URL}/api/bugs`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch bugs');
                }
                
                const bugs = await response.json();
                
                if (bugs.length === 0) {
                    bugsList.innerHTML = '<div class="no-bugs">No bugs found</div>';
                    return;
                }
                
                bugsList.innerHTML = bugs.map(bug => `
                    <div class="bug-item">
                        <div class="bug-header">
                            <div>
                                <span class="bug-id">Bug #${bug.id}</span>
                                <span class="bug-status ${bug.status}">${bug.status}</span>
                            </div>
                            <div style="font-size: 0.85em; color: var(--text-secondary);">
                                ${new Date(bug.created_at).toLocaleString()}
                            </div>
                        </div>
                        <div class="bug-description">${bug.description}</div>
                        <div class="bug-meta">
                            <span>Page: ${bug.page_url || 'Unknown'}</span>
                            ${bug.resolved_at ? `<span>Resolved: ${new Date(bug.resolved_at).toLocaleString()}</span>` : ''}
                        </div>
                        <div class="bug-actions">
                            ${bug.status !== 'in-progress' ? `<button class="bug-action-btn" style="background: #3b82f6; color: white;" onclick="updateBugStatus(${bug.id}, 'in-progress')">Mark In Progress</button>` : ''}
                            ${bug.status !== 'resolved' ? `<button class="bug-action-btn" style="background: #10b981; color: white;" onclick="updateBugStatus(${bug.id}, 'resolved')">Mark Resolved</button>` : ''}
                            ${bug.status !== 'closed' ? `<button class="bug-action-btn" style="background: #6b7280; color: white;" onclick="updateBugStatus(${bug.id}, 'closed')">Close</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading bugs:', error);
                bugsList.innerHTML = '<p style="color: #ef4444;">Error loading bugs. Please refresh.</p>';
            }
        }

        // Update bug status
        async function updateBugStatus(bugId, status) {
            try {
                const response = await fetch(`${API_URL}/api/bugs/${bugId}/status`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ status })
                });
                
                if (response.ok) {
                    loadBugs(); // Reload all bugs
                } else {
                    alert('Failed to update bug status');
                }
            } catch (error) {
                console.error('Error updating bug status:', error);
                alert('Failed to update bug status');
            }
        }

        // Load Google Forms responses
        async function loadFormResponses(formName) {
            const formsList = document.getElementById('google-forms-list');
            if (!formsList) return;
            
            // Update active tab
            document.querySelectorAll('.form-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Find the tab for this form name
                document.querySelectorAll('.form-tab').forEach(tab => {
                    if (tab.textContent.includes(formName)) {
                        tab.classList.add('active');
                    }
                });
            }
            
            formsList.innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
            
            try {
                const response = await fetch(`${API_URL}/api/google-forms/${encodeURIComponent(formName)}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch form responses');
                }
                
                const data = await response.json();
                
                // Check if form is not configured
                if (data.configured === false || data.error) {
                    formsList.innerHTML = `
                        <div class="form-response-item" style="border-color: #f59e0b;">
                            <div class="form-response-label" style="color: #f59e0b;">⚠️ Not Configured</div>
                            <div class="form-response-value" style="margin-top: 10px;">
                                <p>This form is not configured yet.</p>
                                <p style="margin-top: 10px; font-size: 0.9em; color: var(--text-secondary);">
                                    To set up Google Forms integration:
                                </p>
                                <ol style="margin-top: 10px; padding-left: 20px; font-size: 0.9em; color: var(--text-secondary);">
                                    <li>Open your Google Form and link it to a Google Sheet</li>
                                    <li>Create a Google Apps Script (see <code>google-forms-appscript.js</code>)</li>
                                    <li>Deploy it as a web app</li>
                                    <li>Add <code>GOOGLE_FORMS_APPSCRIPT_URL=your_url</code> to your <code>.env.local</code> file</li>
                                    <li>Restart the server</li>
                                </ol>
                                <p style="margin-top: 15px; font-size: 0.9em; color: var(--text-secondary);">
                                    See <code>GOOGLE_FORMS_SETUP.md</code> or <code>GOOGLE_FORMS_QUICK_START.md</code> for detailed instructions.
                                </p>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                if (!data.responses || data.responses.length === 0) {
                    formsList.innerHTML = '<div class="no-bugs">No responses found for this form yet.</div>';
                    return;
                }
                
                // Display response count
                let html = `<div class="form-response-count">Total Responses: ${data.responses.length}</div>`;
                
                // Display each response
                data.responses.forEach((response, index) => {
                    html += `<div class="form-response-item">`;
                    html += `<div style="font-weight: 600; color: var(--accent-primary); margin-bottom: 15px; font-family: 'Inter', sans-serif;">Response #${index + 1}</div>`;
                    
                    // Display each field
                    Object.entries(response).forEach(([key, value]) => {
                        if (value && value.toString().trim() !== '') {
                            html += `<div class="form-response-field">`;
                            html += `<span class="form-response-label">${key}:</span>`;
                            html += `<div class="form-response-value">${escapeHtml(value.toString())}</div>`;
                            html += `</div>`;
                        }
                    });
                    
                    html += `</div>`;
                });
                
                formsList.innerHTML = html;
            } catch (error) {
                console.error('Error loading form responses:', error);
                formsList.innerHTML = `
                    <div class="form-response-item" style="border-color: #ef4444;">
                        <div class="form-response-label" style="color: #ef4444;">Configuration Required</div>
                        <div class="form-response-value" style="margin-top: 10px;">
                            <p>Google Forms integration is not configured yet.</p>
                            <p style="margin-top: 10px; font-size: 0.9em; color: var(--text-secondary);">
                                To set up Google Forms integration:
                            </p>
                            <ol style="margin-top: 10px; padding-left: 20px; font-size: 0.9em; color: var(--text-secondary);">
                                <li>Open your Google Forms and link them to Google Sheets</li>
                                <li>Create a Google Apps Script (see <code>google-forms-appscript.js</code>)</li>
                                <li>Deploy it as a web app</li>
                                <li>Add <code>GOOGLE_FORMS_APPSCRIPT_URL</code> to your <code>.env.local</code> file</li>
                                <li>Restart the server</li>
                            </ol>
                            <p style="margin-top: 15px; font-size: 0.9em; color: var(--text-secondary);">
                                See <code>GOOGLE_FORMS_SETUP.md</code> for detailed instructions.
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        // Load all Google Forms responses
        async function loadAllFormResponses() {
            const formsList = document.getElementById('google-forms-list');
            if (!formsList) return;
            
            // Update active tab
            document.querySelectorAll('.form-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            formsList.innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
            
            try {
                const response = await fetch(`${API_URL}/api/google-forms`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch form responses');
                }
                
                const allForms = await response.json();
                
                if (!allForms || Object.keys(allForms).length === 0) {
                    formsList.innerHTML = '<div class="no-bugs">No form responses found.</div>';
                    return;
                }
                
                let html = '';
                
                // Display each form's responses
                Object.entries(allForms).forEach(([formName, formData]) => {
                    // Check if form is not configured
                    if (formData.configured === false || formData.error) {
                        html += `<div class="form-response-item" style="border-color: #f59e0b;">`;
                        html += `<div class="form-response-label">${formName}</div>`;
                        html += `<div class="form-response-value">`;
                        html += `<p style="color: #f59e0b;">⚠️ Not Configured</p>`;
                        html += `<p style="font-size: 0.9em; color: var(--text-secondary); margin-top: 5px;">`;
                        html += `Add <code>GOOGLE_FORMS_APPSCRIPT_URL</code> to <code>.env.local</code> to enable this form.`;
                        html += `</p>`;
                        html += `</div>`;
                        html += `</div>`;
                        return;
                    }
                    
                    if (!formData.responses || formData.responses.length === 0) {
                        html += `<div class="form-response-item">`;
                        html += `<div class="form-response-label">${formName}</div>`;
                        html += `<div class="form-response-value">No responses yet</div>`;
                        html += `</div>`;
                        return;
                    }
                    
                    html += `<div class="form-response-item" style="margin-bottom: 20px; border-color: var(--accent-primary);">`;
                    html += `<h4 style="color: var(--accent-primary); margin-bottom: 10px; font-family: 'Inter', sans-serif;">${formName} (${formData.responses.length} responses)</h4>`;
                    
                    formData.responses.forEach((response, index) => {
                        html += `<div style="margin-bottom: 15px; padding-left: 15px; border-left: 2px solid var(--border-color);">`;
                        html += `<div style="font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; font-size: 0.9em;">Response #${index + 1}</div>`;
                        
                        Object.entries(response).forEach(([key, value]) => {
                            if (value && value.toString().trim() !== '') {
                                html += `<div class="form-response-field">`;
                                html += `<span class="form-response-label">${key}:</span>`;
                                html += `<div class="form-response-value">${escapeHtml(value.toString())}</div>`;
                                html += `</div>`;
                            }
                        });
                        
                        html += `</div>`;
                    });
                    
                    html += `</div>`;
                });
                
                formsList.innerHTML = html;
            } catch (error) {
                console.error('Error loading all form responses:', error);
                formsList.innerHTML = `<p style="color: #ef4444;">Error loading form responses. ${error.message}</p><p style="color: var(--text-secondary); margin-top: 10px; font-size: 0.9em;">Make sure Google Forms integration is configured. See setup instructions.</p>`;
            }
        }

        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateChart(data) {
            const ctx = document.getElementById('visitor-chart').getContext('2d');

            if (visitorChart) {
                visitorChart.destroy();
            }

            // Format labels based on timeframe
            const labels = data.map(item => {
                const date = new Date(item.time);
                // Format based on timeframe
                if (currentTimeframe === '1hour' || currentTimeframe === '12hours') {
                    return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                } else if (currentTimeframe === 'day' || currentTimeframe === '3days') {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit' });
                } else {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                }
            });

            visitorChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Unique Visitors',
                            data: data.map(item => item.uniqueVisitors),
                            borderColor: '#4a9eff',
                            backgroundColor: 'rgba(74, 158, 255, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 4,
                            pointHoverBorderWidth: 2
                        },
                        {
                            label: 'Total Visits',
                            data: data.map(item => item.totalVisits),
                            borderColor: '#8a5cf6',
                            backgroundColor: 'rgba(138, 92, 246, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 4,
                            pointHoverBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: {
                        duration: 750
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#ffffff',
                                font: {
                                    family: 'Inter, sans-serif',
                                    size: 12
                                }
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(42, 42, 42, 0.95)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: '#4a9eff',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#888888',
                                maxRotation: 45,
                                minRotation: 0,
                                font: {
                                    family: 'Inter, sans-serif'
                                }
                            },
                            grid: {
                                color: 'rgba(74, 158, 255, 0.1)'
                            }
                        },
                        y: {
                            ticks: {
                                color: '#888888',
                                precision: 0,
                                font: {
                                    family: 'Inter, sans-serif'
                                }
                            },
                            grid: {
                                color: 'rgba(74, 158, 255, 0.1)'
                            },
                            beginAtZero: true
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        // Auto-refresh every 60 seconds (reduced frequency for better performance)
        setInterval(() => {
            if (authToken && document.getElementById('dashboard').classList.contains('active')) {
                loadDashboard();
            }
        }, 60000);

        // Allow Enter key to login
        document.getElementById('admin-email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('admin-password').focus();
            }
        });
        
        document.getElementById('admin-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
