<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Nova Hub - Admin Panel</title>
    <link rel="shortcut icon" id="tab-favicon" href="/interstellar-static/favicon.png">
    <link rel="stylesheet" href="/assets/css/global.css?v=6">
    <link rel="stylesheet" href="/assets/css/nav.css?v=01">
    <link rel="stylesheet" href="/assets/css/h.css?v=01">
    <link rel="stylesheet" href="/assets/css/container.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<!-- Google tag (gtag.js) -->

<body class="center">
    <!-- Navigation Bar (only shown when logged in) -->
    <div class="f-nav" id="admin-nav" style="display: none;">
        <div class="f-nav-right">
            <a href="/" class="navbar-link">
                <i class="navbar-icon fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="/admin" class="navbar-link">
                <i class="navbar-icon fas fa-chart-line"></i>
                <span>Admin</span>
            </a>
            <a href="#" class="navbar-link" onclick="logout(); return false;">
                <i class="navbar-icon fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <h2>🔐 Admin Login</h2>
        <input type="email" id="admin-email" placeholder="Enter email address" autocomplete="email">
        <input type="password" id="admin-password" placeholder="Enter password" autocomplete="current-password">
        <button onclick="login()">Login</button>
        <div class="error-message" id="login-error">Invalid email or password</div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <div class="main" style="margin-top: 120px;">
            <h1 class="title" style="margin-top: 0;">📊 Analytics Dashboard</h1>
            <p id="user-info" style="color: var(--text-secondary); margin-top: -30px; margin-bottom: 30px; font-family: 'Inter', sans-serif; text-align: center;"></p>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Visitors</h3>
                    <div class="value" id="total-visitors">0</div>
                </div>
                <div class="stat-card">
                    <h3>Active Sessions</h3>
                    <div class="value" id="active-sessions">0</div>
                </div>
                <div class="stat-card">
                    <h3>Avg. Session Duration</h3>
                    <div class="value" id="avg-duration">0s</div>
                </div>
                <div class="stat-card">
                    <h3>Total Game Plays</h3>
                    <div class="value" id="total-plays">0</div>
                </div>
            </div>

            <div class="timeframe-selector">
                <button class="timeframe-btn" data-timeframe="1hour" onclick="selectTimeframe('1hour')">1 Hour</button>
                <button class="timeframe-btn" data-timeframe="12hours" onclick="selectTimeframe('12hours')">12 Hours</button>
                <button class="timeframe-btn" data-timeframe="day" onclick="selectTimeframe('day')">Day</button>
                <button class="timeframe-btn" data-timeframe="3days" onclick="selectTimeframe('3days')">3 Days</button>
                <button class="timeframe-btn" data-timeframe="week" onclick="selectTimeframe('week')">Week</button>
                <button class="timeframe-btn" data-timeframe="2weeks" onclick="selectTimeframe('2weeks')">2 Weeks</button>
                <button class="timeframe-btn" data-timeframe="month" onclick="selectTimeframe('month')">Month</button>
                <button class="timeframe-btn" data-timeframe="6months" onclick="selectTimeframe('6months')">6 Months</button>
                <button class="timeframe-btn" data-timeframe="year" onclick="selectTimeframe('year')">Year</button>
                <button class="timeframe-btn active" data-timeframe="total" onclick="selectTimeframe('total')">Total</button>
            </div>

            <div class="chart-container">
                <h3>Visitor Statistics</h3>
                <canvas id="visitor-chart"></canvas>
            </div>

            <div class="top-games">
                <h3>🎮 Top 10 Most Played Games</h3>
                <div id="top-games-list" class="loading">Loading...</div>
            </div>

            <div class="google-forms-section">
                <h3>📋 Google Forms Responses</h3>
                <div class="form-tabs">
                    <button class="form-tab active" onclick="loadFormResponses('Bug Reports', event)">Bug Reports</button>
                    <button class="form-tab" onclick="loadFormResponses('Game Requests', event)">Game Requests</button>
                    <button class="form-tab" onclick="loadAllFormResponses(event)">All Forms</button>
                </div>
                <div id="google-forms-list" class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let authToken = localStorage.getItem('admin_token');
        let currentUser = null;
        let currentTimeframe = 'total';
        let visitorChart = null;

        // Check if already logged in
        if (authToken) {
            verifySession();
        }

        async function verifySession() {
            try {
                const response = await fetch(`${API_URL}/api/admin/verify`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const data = await response.json();
                if (data.valid && data.user) {
                    currentUser = data.user;
                    showDashboard();
                } else {
                    localStorage.removeItem('admin_token');
                    authToken = null;
                    currentUser = null;
                }
            } catch (error) {
                console.error('Session verification error:', error);
                localStorage.removeItem('admin_token');
                authToken = null;
                currentUser = null;
            }
        }

        async function login() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const errorDiv = document.getElementById('login-error');

            if (!email || !password) {
                errorDiv.textContent = 'Please enter both email and password';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    authToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('admin_token', authToken);
                    errorDiv.style.display = 'none';
                    showDashboard();
                } else {
                    errorDiv.textContent = data.error || 'Invalid email or password';
                    errorDiv.style.display = 'block';
                    document.getElementById('admin-password').value = '';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection error. Is the server running?';
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            if (authToken) {
                fetch(`${API_URL}/api/admin/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                }).catch(() => {});
            }
            localStorage.removeItem('admin_token');
            authToken = null;
            currentUser = null;
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-password').value = '';
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('admin-nav').style.display = 'none';
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('admin-nav').style.display = 'flex';
            
            // Display user info
            if (currentUser) {
                const userInfo = document.getElementById('user-info');
                userInfo.textContent = `Logged in as: ${currentUser.name || currentUser.email} (${currentUser.role || 'admin'})`;
            }
            
            loadDashboard();
            // Load Google Forms responses after a short delay to ensure everything is ready
            setTimeout(() => {
                if (window.loadFormResponses) {
                    loadFormResponses('Bug Reports');
                } else {
                    console.error('loadFormResponses function not available');
                }
            }, 500);
        }

        function selectTimeframe(timeframe) {
            currentTimeframe = timeframe;
            document.querySelectorAll('.timeframe-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-timeframe="${timeframe}"]`).classList.add('active');
            loadDashboard();
        }

        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
            return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
        }

        async function loadDashboard() {
            try {
                // Show loading state
                document.getElementById('top-games-list').innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
                
                // Load all data in parallel for better performance
                const [statsResponse, activeResponse, chartResponse, gamesResponse] = await Promise.all([
                    fetch(`${API_URL}/api/stats/${currentTimeframe}`),
                    fetch(`${API_URL}/api/active-sessions`),
                    fetch(`${API_URL}/api/chart/${currentTimeframe}`),
                    fetch(`${API_URL}/api/top-games?limit=10`)
                ]);

                const stats = await statsResponse.json();
                const activeData = await activeResponse.json();
                const chartData = await chartResponse.json();
                const topGames = await gamesResponse.json();

                // Update stats
                document.getElementById('total-visitors').textContent = stats.uniqueVisitors || 0;
                document.getElementById('avg-duration').textContent = formatDuration(stats.avgDuration || 0);
                document.getElementById('total-plays').textContent = stats.totalGamePlays || 0;
                document.getElementById('active-sessions').textContent = activeData.activeSessions || 0;

                // Update chart
                updateChart(chartData);

                // Update top games
                const gamesList = document.getElementById('top-games-list');
                if (topGames.length === 0) {
                    gamesList.innerHTML = '<p style="color: var(--text-secondary);">No games played yet</p>';
                } else {
                    gamesList.innerHTML = topGames.map((game, index) => `
                        <div class="game-item">
                            <span class="game-name">${index + 1}. ${game.game_name.replace(/-/g, ' ')}</span>
                            <span class="game-count">${game.play_count} plays</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Dashboard load error:', error);
                document.getElementById('top-games-list').innerHTML = '<p style="color: #ef4444;">Error loading data. Please refresh.</p>';
            }
        }

        // Load Google Forms responses - Make globally accessible
        window.loadFormResponses = async function(formName, event = null) {
            const formsList = document.getElementById('google-forms-list');
            if (!formsList) {
                console.error('Google forms list element not found');
                return;
            }
            
            // Update active tab
            document.querySelectorAll('.form-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Find the tab for this form name
                document.querySelectorAll('.form-tab').forEach(tab => {
                    if (tab.textContent.includes(formName)) {
                        tab.classList.add('active');
                    }
                });
            }
            
            formsList.innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
            
            try {
                if (!authToken) {
                    throw new Error('Not authenticated. Please log in again.');
                }
                
                console.log(`[Admin] Loading form responses for: ${formName}`);
                console.log(`[Admin] API URL: ${API_URL}/api/google-forms/${encodeURIComponent(formName)}`);
                console.log(`[Admin] Auth token exists: ${!!authToken}`);
                
                const response = await fetch(`${API_URL}/api/google-forms/${encodeURIComponent(formName)}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log(`[Admin] Response status: ${response.status} ${response.statusText}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`[Admin] Error response:`, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText || 'Failed to fetch form responses'}`);
                }
                
                const data = await response.json();
                
                // Log response for debugging
                console.log('[Admin] Form responses data:', data);
                
                // Check if form is not configured
                if (data.configured === false || data.error) {
                    formsList.innerHTML = `
                        <div class="form-response-item" style="border-color: #f59e0b;">
                            <div class="form-response-label" style="color: #f59e0b;">⚠️ Not Configured</div>
                            <div class="form-response-value" style="margin-top: 10px;">
                                <p>This form is not configured yet.</p>
                                <p style="margin-top: 10px; font-size: 0.9em; color: var(--text-secondary);">
                                    To set up Google Forms integration:
                                </p>
                                <ol style="margin-top: 10px; padding-left: 20px; font-size: 0.9em; color: var(--text-secondary);">
                                    <li>Open your Google Form and link it to a Google Sheet</li>
                                    <li>Create a Google Apps Script (see <code>google-forms-appscript.js</code>)</li>
                                    <li>Deploy it as a web app</li>
                                    <li>Add <code>GOOGLE_FORMS_APPSCRIPT_URL=your_url</code> to your <code>.env.local</code> file</li>
                                    <li>Restart the server</li>
                                </ol>
                                <p style="margin-top: 15px; font-size: 0.9em; color: var(--text-secondary);">
                                    See <code>GOOGLE_FORMS_SETUP.md</code> or <code>GOOGLE_FORMS_QUICK_START.md</code> for detailed instructions.
                                </p>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                if (!data.responses || data.responses.length === 0) {
                    formsList.innerHTML = '<div class="no-bugs">No responses found for this form yet.</div>';
                    return;
                }
                
                // Display response count
                let html = `<div class="form-response-count">Total Responses: ${data.responses.length}</div>`;
                
                // Display each response
                data.responses.forEach((response, index) => {
                    html += `<div class="form-response-item">`;
                    html += `<div style="font-weight: 600; color: var(--accent-primary); margin-bottom: 15px; font-family: 'Inter', sans-serif;">Response #${index + 1}</div>`;
                    
                    // Display each field
                    Object.entries(response).forEach(([key, value]) => {
                        if (value && value.toString().trim() !== '') {
                            html += `<div class="form-response-field">`;
                            html += `<span class="form-response-label">${key}:</span>`;
                            html += `<div class="form-response-value">${escapeHtml(value.toString())}</div>`;
                            html += `</div>`;
                        }
                    });
                    
                    html += `</div>`;
                });
                
                formsList.innerHTML = html;
            } catch (error) {
                console.error('Error loading form responses:', error);
                formsList.innerHTML = `
                    <div class="form-response-item" style="border-color: #ef4444;">
                        <div class="form-response-label" style="color: #ef4444;">Configuration Required</div>
                        <div class="form-response-value" style="margin-top: 10px;">
                            <p>Google Forms integration is not configured yet.</p>
                            <p style="margin-top: 10px; font-size: 0.9em; color: var(--text-secondary);">
                                To set up Google Forms integration:
                            </p>
                            <ol style="margin-top: 10px; padding-left: 20px; font-size: 0.9em; color: var(--text-secondary);">
                                <li>Open your Google Forms and link them to Google Sheets</li>
                                <li>Create a Google Apps Script (see <code>google-forms-appscript.js</code>)</li>
                                <li>Deploy it as a web app</li>
                                <li>Add <code>GOOGLE_FORMS_APPSCRIPT_URL</code> to your <code>.env.local</code> file</li>
                                <li>Restart the server</li>
                            </ol>
                            <p style="margin-top: 15px; font-size: 0.9em; color: var(--text-secondary);">
                                See <code>GOOGLE_FORMS_SETUP.md</code> for detailed instructions.
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        // Load all Google Forms responses - Make globally accessible
        window.loadAllFormResponses = async function(event = null) {
            const formsList = document.getElementById('google-forms-list');
            if (!formsList) {
                console.error('Google forms list element not found');
                return;
            }
            
            // Update active tab
            document.querySelectorAll('.form-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            }
            
            formsList.innerHTML = '<p style="color: var(--text-secondary);">Loading...</p>';
            
            try {
                if (!authToken) {
                    throw new Error('Not authenticated. Please log in again.');
                }
                
                console.log(`[Admin] Loading all form responses`);
                console.log(`[Admin] API URL: ${API_URL}/api/google-forms`);
                console.log(`[Admin] Auth token exists: ${!!authToken}`);
                
                const response = await fetch(`${API_URL}/api/google-forms`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log(`[Admin] Response status: ${response.status} ${response.statusText}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`[Admin] Error response:`, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText || 'Failed to fetch form responses'}`);
                }
                
                const allForms = await response.json();
                console.log('[Admin] All forms data:', allForms);
                
                if (!allForms || Object.keys(allForms).length === 0) {
                    formsList.innerHTML = '<div class="no-bugs">No form responses found.</div>';
                    return;
                }
                
                let html = '';
                
                // Display each form's responses
                Object.entries(allForms).forEach(([formName, formData]) => {
                    // Check if form is not configured
                    if (formData.configured === false || formData.error) {
                        html += `<div class="form-response-item" style="border-color: #f59e0b;">`;
                        html += `<div class="form-response-label">${formName}</div>`;
                        html += `<div class="form-response-value">`;
                        html += `<p style="color: #f59e0b;">⚠️ Not Configured</p>`;
                        html += `<p style="font-size: 0.9em; color: var(--text-secondary); margin-top: 5px;">`;
                        html += `Add <code>GOOGLE_FORMS_APPSCRIPT_URL</code> to <code>.env.local</code> to enable this form.`;
                        html += `</p>`;
                        html += `</div>`;
                        html += `</div>`;
                        return;
                    }
                    
                    if (!formData.responses || formData.responses.length === 0) {
                        html += `<div class="form-response-item">`;
                        html += `<div class="form-response-label">${formName}</div>`;
                        html += `<div class="form-response-value">No responses yet</div>`;
                        html += `</div>`;
                        return;
                    }
                    
                    html += `<div class="form-response-item" style="margin-bottom: 20px; border-color: var(--accent-primary);">`;
                    html += `<h4 style="color: var(--accent-primary); margin-bottom: 10px; font-family: 'Inter', sans-serif;">${formName} (${formData.responses.length} responses)</h4>`;
                    
                    formData.responses.forEach((response, index) => {
                        html += `<div style="margin-bottom: 15px; padding-left: 15px; border-left: 2px solid var(--border-color);">`;
                        html += `<div style="font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; font-size: 0.9em;">Response #${index + 1}</div>`;
                        
                        Object.entries(response).forEach(([key, value]) => {
                            if (value && value.toString().trim() !== '') {
                                html += `<div class="form-response-field">`;
                                html += `<span class="form-response-label">${key}:</span>`;
                                html += `<div class="form-response-value">${escapeHtml(value.toString())}</div>`;
                                html += `</div>`;
                            }
                        });
                        
                        html += `</div>`;
                    });
                    
                    html += `</div>`;
                });
                
                formsList.innerHTML = html;
            } catch (error) {
                console.error('Error loading all form responses:', error);
                formsList.innerHTML = `<p style="color: #ef4444;">Error loading form responses. ${error.message}</p><p style="color: var(--text-secondary); margin-top: 10px; font-size: 0.9em;">Make sure Google Forms integration is configured. See setup instructions.</p>`;
            }
        }

        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateChart(data) {
            const ctx = document.getElementById('visitor-chart').getContext('2d');

            if (visitorChart) {
                visitorChart.destroy();
            }

            // Format labels based on timeframe
            const labels = data.map(item => {
                const date = new Date(item.time);
                // Format based on timeframe
                if (currentTimeframe === '1hour' || currentTimeframe === '12hours') {
                    return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                } else if (currentTimeframe === 'day' || currentTimeframe === '3days') {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit' });
                } else {
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                }
            });

            visitorChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Unique Visitors',
                            data: data.map(item => item.uniqueVisitors),
                            borderColor: '#4a9eff',
                            backgroundColor: 'rgba(74, 158, 255, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 4,
                            pointHoverBorderWidth: 2
                        },
                        {
                            label: 'Total Visits',
                            data: data.map(item => item.totalVisits),
                            borderColor: '#8a5cf6',
                            backgroundColor: 'rgba(138, 92, 246, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 2,
                            pointHoverRadius: 4,
                            pointHoverBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: {
                        duration: 750
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#ffffff',
                                font: {
                                    family: 'Inter, sans-serif',
                                    size: 12
                                }
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(42, 42, 42, 0.95)',
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            borderColor: '#4a9eff',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#888888',
                                maxRotation: 45,
                                minRotation: 0,
                                font: {
                                    family: 'Inter, sans-serif'
                                }
                            },
                            grid: {
                                color: 'rgba(74, 158, 255, 0.1)'
                            }
                        },
                        y: {
                            ticks: {
                                color: '#888888',
                                precision: 0,
                                font: {
                                    family: 'Inter, sans-serif'
                                }
                            },
                            grid: {
                                color: 'rgba(74, 158, 255, 0.1)'
                            },
                            beginAtZero: true
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        // Auto-refresh every 60 seconds (reduced frequency for better performance)
        setInterval(() => {
            if (authToken && document.getElementById('dashboard').classList.contains('active')) {
                loadDashboard();
            }
        }, 60000);

        // Allow Enter key to login
        document.getElementById('admin-email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('admin-password').focus();
            }
        });
        
        document.getElementById('admin-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
