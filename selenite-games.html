            const gameGrid = document.getElementById('game-grid');
            const searchBar = document.getElementById('search-bar');
            const gameCount = document.getElementById('game-count');
            const noResults = document.getElementById('no-results');

            function renderGames(filteredGames = seleniteGames) {
                if (!gameGrid) return;
                
                gameGrid.innerHTML = '';
                
                if (filteredGames.length === 0) {
                    noResults.classList.add('show');
                    if (gameCount) gameCount.textContent = '0 games found';
                    return;
                }
                
                noResults.classList.remove('show');
                if (gameCount) gameCount.textContent = `${filteredGames.length} game${filteredGames.length !== 1 ? 's' : ''} found`;
                
                filteredGames.forEach((game, index) => {
                    const card = document.createElement('a');
                    // Use proxy to load Selenite games
                    const gameUrl = `https://selenite.cc/${game.name}`;
                    // Encode URL for proxy
                    let encodedUrl;
                    if (typeof __uv$config !== 'undefined' && __uv$config.encodeUrl) {
                        encodedUrl = __uv$config.encodeUrl(gameUrl);
                    } else {
                        // Fallback encoding
                        encodedUrl = btoa(gameUrl).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                    }
                    card.href = `/a/${encodedUrl}`;
                    card.className = 'game-card fade-in';
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    const name = document.createElement('div');
                    name.className = 'game-name';
                    name.textContent = game.name.split('-').map(word => 
                        word.charAt(0).toUpperCase() + word.slice(1)
                    ).join(' ');
                    
                    const description = document.createElement('div');
                    description.className = 'game-description';
                    description.textContent = game.description;
                    
                    card.appendChild(name);
                    card.appendChild(description);
                    gameGrid.appendChild(card);
                });
            }

            // Search functionality
            if (searchBar) {
                searchBar.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase().trim();
                    const filtered = seleniteGames.filter(game => 
                        game.name.toLowerCase().includes(searchTerm) ||
                        game.description.toLowerCase().includes(searchTerm)
                    );
                    renderGames(filtered);
                });
            }

            // Initial render
            renderGames();
        });
