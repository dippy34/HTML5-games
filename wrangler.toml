name = "buh-avon"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cloudflare Pages configuration
pages_build_output_dir = "."

# Your Cloudflare Workers domain (for Workers deployment)
# routes = [
#   { pattern = "buh-avon.bestboymg1.workers.dev", zone_name = "bestboymg1.workers.dev" }
# ]

# Environment variables (set these in Cloudflare Dashboard)
# [vars]
# GA4_PROPERTY_ID = "properties/515011009"
# GA4_SERVICE_ACCOUNT_KEY = "[Set in Cloudflare Dashboard as single-line JSON - no line breaks]"
# GA4_MEASUREMENT_ID = "G-GGK2QKXDXW"
# GOOGLE_FORMS_APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfBeuMPu839ggHuPFR5y-NOdcYOiAoQpA1epliY3xP4B9zddZ_SW1c89NkUEjlD4tjPQ/exec"

# Workers KV namespaces (for static files and data storage)
# [[kv_namespaces]]
# binding = "STATIC_FILES"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# D1 Database (for analytics - alternative to SQLite)
# [[d1_databases]]
# binding = "DB"
# database_name = "nova-hub-db"
# database_id = "your-d1-database-id"

# R2 Bucket (for large static files like games)
# [[r2_buckets]]
# binding = "GAMES_BUCKET"
# bucket_name = "nova-hub-games"

# Limits
[limits]
cpu_ms = 50

