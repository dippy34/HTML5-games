<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Home</title>
  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/h.css?v=01" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Ads removed for Nova Hub -->
</head>

<body class="center" onload="SplashT">
  <div class="f-nav"></div>
  <div id="particles-js" style="display: none;"></div>
  <div class="main">
      <img src="../novahub-logo.png" alt="Nova Hub" class="title" style="max-width: 500px; width: 100%; height: auto; object-fit: contain;">
      <p id="splash"></p>
      <div class="search-container">
        <form id="fv" method="POST">
          <input id="input" class="truncate" placeholder="Search or enter a URL" type="text" />
        </form>
      </div>
    </div>
  </div>
  <script src="/assets/js/interactive-bg.js"></script>
  <script src="assets/js/index-3.js"></script>
  <script src="/assets/js/h1.js"></script>
  <script src="./assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="./assets/mathematics/config.js?v=2025-04-15"></script>
  <script src="/assets/js/m1.js"></script>
  <script>
    // Mouse interaction for Nova Hub logo
    document.addEventListener('DOMContentLoaded', () => {
      const title = document.querySelector('.title');
      if (!title) return;

      title.addEventListener('mousemove', (e) => {
        const rect = title.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const moveX = (x - centerX) / centerX;
        const moveY = (y - centerY) / centerY;
        
        title.style.transform = `translate(${moveX * 5}px, ${moveY * 5 - 5}px) scale(1.03)`;
        title.style.filter = `drop-shadow(${moveX * 10}px ${moveY * 10 + 4}px 20px rgba(74, 158, 255, 0.6)) drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3))`;
      });

      title.addEventListener('mouseleave', () => {
        title.style.transform = '';
        title.style.filter = 'drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.2))';
      });
    });
  </script>
  <!-- Analytics removed for Nova Hub -->
</body>

</html>
