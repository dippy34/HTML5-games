  <script>
    // Mouse interaction for NOVAHUB title
    document.addEventListener('DOMContentLoaded', () => {
      const title = document.querySelector('.title');
      if (!title) return;

      title.addEventListener('mousemove', (e) => {
        const rect = title.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const moveX = (x - centerX) / centerX;
        const moveY = (y - centerY) / centerY;
        
        title.style.transform = `translate(${moveX * 5}px, ${moveY * 5 - 5}px) scale(1.03)`;
        title.style.textShadow = `
          ${moveX * 10}px ${moveY * 10 + 4}px 20px rgba(74, 158, 255, 0.6),
          2px 4px 6px rgba(0, 0, 0, 0.3)
        `;
      });

      title.addEventListener('mouseleave', () => {
        title.style.transform = '';
        title.style.textShadow = '2px 4px 6px rgba(0, 0, 0, 0.2)';
      });
    });
  </script>
