<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
  <title id="t">Game Requests</title>
  <link rel="stylesheet" id="global" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/container.css?v=2" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=01" />
  <link rel="stylesheet" href="/assets/css/settings.css?v=06" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .form-button {
      display: inline-block;
      padding: 18px 36px;
      background: linear-gradient(135deg, #4a9eff, #6bb3ff);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 18px;
      box-shadow: 0 4px 16px rgba(74, 158, 255, 0.4);
      transition: all 0.3s ease;
      border: 2px solid rgba(74, 158, 255, 0.3);
    }
    .form-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(74, 158, 255, 0.6);
      background: linear-gradient(135deg, #6bb3ff, #8bc5ff);
    }
    .form-button:active {
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="f-nav"></div>
  <div class="main">
    <div class="settings-container">
      <div class="settings-card" style="max-width: 600px; margin: 0 auto; text-align: center;">
        <h3>Game & Feature Requests</h3>
        <p style="margin-bottom: 30px;">Want to see a new game or feature added? Click the button below to submit your request! If requesting a game, please include the GitHub URL if possible.</p>
        <a href="https://forms.gle/NUSFG88PLRvadHwn6" target="_blank" rel="noopener noreferrer" class="form-button">
          <i class="fa-solid fa-plus-circle" style="margin-right: 8px;"></i>
          Request Game or Feature
        </a>
      </div>
    </div>
  </div>
  <script src="/assets/js/interactive-bg.js"></script>
  <script src="/assets/js/m1.js"></script>
</body>

</html>
