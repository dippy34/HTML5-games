<body>
  <script>
    // Password protection for Test Tab
    (function() {
      const PASSWORD = 'Matusha2013';
      const AUTH_KEY = 'testTabAuthenticated';
      
      // Check if already authenticated in this session
      const isAuthenticated = sessionStorage.getItem(AUTH_KEY) === 'true';
      
      if (!isAuthenticated) {
        // Hide body content
        document.body.style.display = 'none';
        
        // Prompt for password
        const enteredPassword = prompt('This page is password protected. Please enter the password:');
        
        if (enteredPassword === PASSWORD) {
          // Correct password - authenticate and show page
          sessionStorage.setItem(AUTH_KEY, 'true');
          document.body.style.display = '';
        } else {
          // Wrong password - redirect to home
          alert('Incorrect password. Redirecting to home page.');
          window.location.href = '/';
        }
      }
    })();
  </script>
  
  <div class="f-nav"></div>
  <div class="input-c">
    <input type="text" id="search" onkeyup="bar()" placeholder="Search Test Tab games..." />
  </div>
  
  <div class="games-grid"></div>
  
  <script src="/assets/js/m1.js?v=003"></script>
  <script src="/assets/js/card-styles.js"></script>
  <script>
    // Prevent c1.js from loading apps - define page type variables first
    const g = false;
    const a = false;
    const c = false;
    
    // Simple search function
    function bar() {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const games = document.querySelectorAll('.games-grid .column');
      games.forEach(game => {
        const gameName = game.querySelector('p')?.textContent?.toLowerCase() || '';
        if (gameName.includes(searchTerm)) {
          game.style.display = '';
        } else {
          game.style.display = 'none';
        }
      });
    }
    
    // Simplified createGameCard function for Selenite page only
    function createGameCard(app, appIndex, pinList) {
      const columnDiv = document.createElement('div');
      columnDiv.classList.add('column');
      const categories = Array.isArray(app.categories) && app.categories.length > 0 
        ? app.categories 
        : ['all'];
      columnDiv.setAttribute('data-category', categories.join(' '));

      const link = document.createElement('a');
      link.href = app.link;
      link.onclick = (e) => {
        if (app.local) {
          e.preventDefault();
          window.location.href = app.link;
        }
      };

      const thumbnailContainer = document.createElement('div');
      thumbnailContainer.className = 'thumbnail-container';

      const image = document.createElement('img');
      image.alt = app.name;
      image.className = 'thumbnail-img';
      image.src = app.image || '/assets/media/icons/custom.webp';
      image.onerror = () => {
        image.src = '/assets/media/icons/custom.webp';
      };
      
      thumbnailContainer.appendChild(image);
      link.appendChild(thumbnailContainer);

      const paragraph = document.createElement('p');
      const nameContainer = document.createElement('div');
      nameContainer.className = 'game-name';
      nameContainer.textContent = app.name;
      paragraph.appendChild(nameContainer);
      link.appendChild(paragraph);

      columnDiv.appendChild(link);
      return columnDiv;
    }

    // Load Selenite games after scripts are loaded
    let gamesLoaded = false;
    function loadSeleniteGames() {
      if (gamesLoaded) return; // Prevent duplicate loading
      const gamesGrid = document.querySelector('.games-grid');
      if (!gamesGrid) {
        setTimeout(loadSeleniteGames, 100);
        return;
      }
      gamesLoaded = true;

      const games = [
        {
          name: 'Bouncing DVD Logo',
          link: '/e/dvdlogo2/index.html',
          local: true,
          categories: ['all', 'fun'],
          image: '/assets/media/icons/custom.webp'
        }
      ];

      // Create game cards using our local function
      games.forEach((game, index) => {
        const card = createGameCard(game, index, []);
        gamesGrid.appendChild(card);
      });
    }

    // Wait for DOM and scripts to load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(loadSeleniteGames, 100);
      });
    } else {
      setTimeout(loadSeleniteGames, 100);
    }
  </script>
  <!-- Analytics removed for Nova Hub -->
</body>

</html>
